[project]
name = "napari-label-assistant"
version = "1.0.0"
description = "Responsive annotation of 100,000 × 100,000-pixel images with traceable grid-based mask review"
keywords = [
    "napari",
    "image segmentation",
    "labels",
    "annotation",
    "quality control",
    "grid registration",
    "large images",
]
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Wulin Teo"}]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: napari",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "napari>=0.4.19",
    "numpy",
    "qtpy",
    "scikit-image",
    "scipy",
]

[project.optional-dependencies]
all = ["napari[all]>=0.4.19"]
test = ["pytest", "pytest-qt", "napari[qt]>=0.4.19"]

[project.entry-points."napari.manifest"]
napari-label-assistant = "napari_label_assistant_tools:napari.yaml"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
napari_label_assistant_tools = ["napari.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
