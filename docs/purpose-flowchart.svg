<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="950" viewBox="0 0 1560 950" role="img" aria-labelledby="title desc">
<title id="title">napari-label-assistant: purpose and workflow</title>
<desc id="desc">Open microscopy images and candidate masks, edit and curate, review and confirm, then use curated labels for measurement or optional dataset preparation, training, and prediction. Predictions return to human editing. Workspace saving supports every stage.</desc>
<defs>
<marker id="main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#324b5b"/></marker>
<marker id="learn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6a55a1"/></marker>
<marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#bd7024"/></marker>
</defs>
<rect width="1560" height="950" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="60" y="59" font-size="24" fill="#206b65" font-weight="700" text-anchor="start">napari-label-assistant</text>
<text x="60" y="111" font-size="36" fill="#182f40" font-weight="700" text-anchor="start">Turn candidate masks into curated annotations</text>
<text x="60" y="148" font-size="21" fill="#425466" font-weight="400" text-anchor="start">Human-guided editing, object cleanup and spatial review — with optional model training.</text>
<rect x="60" y="210" width="300" height="150" rx="14" fill="#edf3f9" stroke="#a4bad1" stroke-width="1.7"/>
<text x="82" y="247" font-size="23" fill="#182f40" font-weight="700" text-anchor="start">Images + masks</text>
<text x="82" y="280" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Microscopy images</text>
<text x="82" y="305" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Manual / SAM3 / other tools</text>
<text x="82" y="330" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Start or resume a workspace</text>
<rect x="430" y="210" width="300" height="150" rx="14" fill="#eaf5ef" stroke="#8ab89a" stroke-width="1.7"/>
<text x="452" y="247" font-size="23" fill="#182f40" font-weight="700" text-anchor="start">Edit &amp; curate</text>
<text x="452" y="280" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Paint, erase and inspect</text>
<text x="452" y="305" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Clean up connected objects</text>
<text x="452" y="330" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Combine and correct labels</text>
<rect x="800" y="210" width="300" height="150" rx="14" fill="#eaf5ef" stroke="#8ab89a" stroke-width="1.7"/>
<text x="822" y="247" font-size="23" fill="#182f40" font-weight="700" text-anchor="start">Review &amp; confirm</text>
<text x="822" y="280" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Check targets + background</text>
<text x="822" y="305" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Confirm complete regions</text>
<text x="822" y="330" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Locate findings by grid cell</text>
<rect x="1170" y="210" width="300" height="150" rx="14" fill="#def0ed" stroke="#5e9e95" stroke-width="1.7"/>
<text x="1192" y="247" font-size="23" fill="#182f40" font-weight="700" text-anchor="start">Curated Labels</text>
<text x="1192" y="280" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Reusable annotations</text>
<text x="1192" y="305" font-size="17" fill="#425466" font-weight="400" text-anchor="start">For measurement, export</text>
<text x="1192" y="330" font-size="17" fill="#425466" font-weight="400" text-anchor="start">and optional model training</text>
<path d="M360 285 H425" fill="none" stroke="#324b5b" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#main)"/>
<path d="M730 285 H795" fill="none" stroke="#324b5b" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#main)"/>
<path d="M1100 285 H1165" fill="none" stroke="#324b5b" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#main)"/>
<rect x="1150" y="405" width="320" height="80" rx="14" fill="#edf3f9" stroke="#a4bad1" stroke-width="1.7"/>
<text x="1172" y="442" font-size="23" fill="#182f40" font-weight="700" text-anchor="start">Measure / quantify</text>
<text x="1172" y="475" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Inspect components or export</text>
<path d="M1470 285 H1505 V445 H1475" fill="none" stroke="#324b5b" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#main)"/>
<text x="280" y="425" font-size="18" fill="#6a55a1" font-weight="400" text-anchor="start">Optional: learn from confirmed annotations</text>
<rect x="45" y="495" width="1440" height="190" rx="20" fill="#f2eff8" stroke="#c9bedf" stroke-dasharray="6 6"/>
<rect x="65" y="515" width="385" height="150" rx="14" fill="#ffffff" stroke="#b1a1ce" stroke-width="1.7"/>
<text x="87" y="552" font-size="23" fill="#182f40" font-weight="700" text-anchor="start">Prepare dataset</text>
<text x="87" y="585" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Use confirmed annotation pixels</text>
<text x="87" y="610" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Exclude unknown / unreviewed pixels</text>
<text x="87" y="635" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Reserve spatial or specimen holdouts</text>
<rect x="565" y="515" width="385" height="150" rx="14" fill="#ffffff" stroke="#b1a1ce" stroke-width="1.7"/>
<text x="587" y="552" font-size="23" fill="#182f40" font-weight="700" text-anchor="start">Train &amp; validate</text>
<text x="587" y="585" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Train a model for the biological task</text>
<text x="587" y="610" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Evaluate on held-out annotations</text>
<text x="587" y="635" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Save checkpoints and run history</text>
<rect x="1065" y="515" width="385" height="150" rx="14" fill="#ffffff" stroke="#b1a1ce" stroke-width="1.7"/>
<text x="1087" y="552" font-size="23" fill="#182f40" font-weight="700" text-anchor="start">Predict new masks</text>
<text x="1087" y="585" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Apply a selected model</text>
<text x="1087" y="610" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Predict an area or an entire image</text>
<text x="1087" y="635" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Inspect and correct the results</text>
<path d="M1320 360 V395 H257 V510" fill="none" stroke="#6a55a1" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#learn)"/>
<path d="M450 590 H560" fill="none" stroke="#6a55a1" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#learn)"/>
<path d="M950 590 H1060" fill="none" stroke="#6a55a1" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#learn)"/>
<path d="M1450 590 H1525 V735 H30 V170 H580 V205" fill="none" stroke="#bd7024" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#feedback)"/>
<text x="780" y="767" font-size="20" fill="#a45d19" font-weight="500" text-anchor="middle">Predictions return to human editing and review before reuse.</text>
<text x="780" y="813" font-size="16" fill="#425466" font-weight="400" text-anchor="middle">Training validity: reviewed regions = foreground + background · selected objects = foreground only · unknown = excluded</text>
<rect x="60" y="850" width="1410" height="64" rx="12" fill="#e7edf3"/>
<text x="80" y="889" font-size="21" fill="#182f40" font-weight="700" text-anchor="start">Across all stages: save &amp; reopen the workspace</text>
<text x="700" y="889" font-size="19" fill="#425466" font-weight="400" text-anchor="start">Images · annotations · review status · model records</text>
<text x="60" y="939" font-size="16" fill="#425466" font-weight="400" text-anchor="start">Full-resolution editing and analysis; bounded views and chunked processing for large images.</text>
</g>
</svg>
