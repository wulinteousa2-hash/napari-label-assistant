<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1090" viewBox="0 0 1560 1090" role="img" aria-labelledby="title desc">
<title id="title">napari-label-assistant: purpose and workflow</title>
<desc id="desc">An end-to-end visual segmentation workflow in napari: open an image, create or import masks, curate and confirm annotations, prepare reviewed training data, train and validate a model locally or with distributed compute, and predict new masks. Predictions return to human editing and review. Bounded memory use supports large 2D images approaching 100,000 by 100,000 pixels. Curated annotations can also be measured or exported, and the workspace can be saved and resumed throughout.</desc>
<defs>
<marker id="main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#324b5b"/></marker>
<marker id="learn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6a55a1"/></marker>
<marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#bd7024"/></marker>
</defs>
<rect width="1560" height="1090" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="60" y="59" font-size="24" fill="#206b65" font-weight="700" text-anchor="start">napari-label-assistant</text>
<text x="60" y="111" font-size="34" fill="#182f40" font-weight="700" text-anchor="start">From large images to masks, models, and predictions</text>
<text x="60" y="146" font-size="20" fill="#425466" font-weight="400" text-anchor="start">Create training annotations, build models, and refine predictions in one visual workspace.</text>
<rect x="60" y="165" width="1440" height="82" rx="12" fill="#def0ed"/>
<text x="80" y="197" font-size="22" fill="#206b65" font-weight="700" text-anchor="start">Built for large 2D images approaching 100k × 100k pixels</text>
<text x="80" y="226" font-size="18" fill="#425466" font-weight="400" text-anchor="start">Bounded memory use · full-resolution local editing · streamed component analysis</text>
<rect x="60" y="290" width="440" height="185" rx="14" fill="#edf3f9" stroke="#a4bad1" stroke-width="1.7"/>
<text x="82" y="327" font-size="23" fill="#182f40" font-weight="700" text-anchor="start">1  Open image</text>
<text x="82" y="369" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Start from a microscopy image</text>
<text x="82" y="394" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Create a new mask or import candidates</text>
<text x="82" y="419" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Start or resume a workspace</text>
<rect x="560" y="290" width="440" height="185" rx="14" fill="#eaf5ef" stroke="#8ab89a" stroke-width="1.7"/>
<text x="582" y="327" font-size="23" fill="#182f40" font-weight="700" text-anchor="start">2  Create &amp; curate masks</text>
<text x="582" y="369" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Paint, erase and correct labels</text>
<text x="582" y="394" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Inspect connected components</text>
<text x="582" y="419" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Clean up and combine objects</text>
<rect x="1060" y="290" width="440" height="185" rx="14" fill="#eaf5ef" stroke="#8ab89a" stroke-width="1.7"/>
<text x="1082" y="327" font-size="23" fill="#182f40" font-weight="700" text-anchor="start">3  Review &amp; confirm</text>
<text x="1082" y="369" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Check objects AND background</text>
<text x="1082" y="394" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Track regions in annotation batches</text>
<text x="1082" y="419" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Locate findings by reproducible grid cell</text>
<path d="M500 382 H555" fill="none" stroke="#324b5b" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#main)"/>
<path d="M1000 382 H1055" fill="none" stroke="#324b5b" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#main)"/>
<path d="M1280 475 V520 H280 V570" fill="none" stroke="#6a55a1" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#learn)"/>
<text x="780" y="550" font-size="18" fill="#6a55a1" font-weight="400" text-anchor="middle">Confirmed annotations become training supervision</text>
<rect x="60" y="575" width="440" height="185" rx="14" fill="#f2eff8" stroke="#b1a1ce" stroke-width="1.7"/>
<text x="82" y="612" font-size="23" fill="#182f40" font-weight="700" text-anchor="start">4  Prepare dataset</text>
<text x="82" y="654" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Use confirmed annotation pixels</text>
<text x="82" y="679" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Exclude unknown or unreviewed pixels</text>
<text x="82" y="704" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Reserve spatial or specimen holdouts</text>
<rect x="560" y="575" width="440" height="185" rx="14" fill="#f2eff8" stroke="#b1a1ce" stroke-width="1.7"/>
<text x="582" y="612" font-size="23" fill="#182f40" font-weight="700" text-anchor="start">5  Build &amp; validate model</text>
<text x="582" y="654" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Choose a task and model architecture</text>
<text x="582" y="679" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Train locally or with distributed compute</text>
<text x="582" y="704" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Validate on reserved regions or specimens</text>
<text x="582" y="729" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Save checkpoints and learning history</text>
<rect x="1060" y="575" width="440" height="185" rx="14" fill="#f2eff8" stroke="#b1a1ce" stroke-width="1.7"/>
<text x="1082" y="612" font-size="23" fill="#182f40" font-weight="700" text-anchor="start">6  Predict &amp; inspect</text>
<text x="1082" y="654" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Apply a selected model to images</text>
<text x="1082" y="679" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Predict an area or an entire image</text>
<text x="1082" y="704" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Inspect results in the same viewer</text>
<text x="1082" y="729" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Return to editing, review, and refinement</text>
<path d="M500 667 H555" fill="none" stroke="#6a55a1" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#learn)"/>
<path d="M1000 667 H1055" fill="none" stroke="#6a55a1" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#learn)"/>
<path d="M1280 760 V805 H30 V265 H780 V285" fill="none" stroke="#bd7024" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#feedback)"/>
<text x="60" y="845" font-size="20" fill="#a45d19" font-weight="500" text-anchor="start">Review and correct predictions before reusing them for training.</text>
<text x="60" y="879" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Repeat the loop with new annotation batches and model revisions.</text>
<rect x="1060" y="815" width="440" height="90" rx="14" fill="#edf3f9" stroke="#a4bad1" stroke-width="1.7"/>
<text x="1082" y="851" font-size="23" fill="#182f40" font-weight="700" text-anchor="start">Measure or export</text>
<text x="1082" y="882" font-size="17" fill="#425466" font-weight="400" text-anchor="start">Use curated masks for downstream analysis</text>
<path d="M1500 382 H1530 V860 H1505" fill="none" stroke="#324b5b" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#main)"/>
<text x="780" y="935" font-size="15" fill="#425466" font-weight="400" text-anchor="middle">Training validity: reviewed regions = foreground + background · selected objects = foreground only · unknown = excluded</text>
<rect x="60" y="960" width="1440" height="92" rx="12" fill="#e7edf3"/>
<text x="80" y="995" font-size="22" fill="#182f40" font-weight="700" text-anchor="start">Save and resume at every stage</text>
<text x="80" y="1026" font-size="18" fill="#425466" font-weight="400" text-anchor="start">Images · masks · review and batch state · dataset settings · model records and checkpoints</text>
<text x="60" y="1078" font-size="16" fill="#425466" font-weight="400" text-anchor="start">Training and prediction are optional; curated masks can also be used directly for measurement or export.</text>
</g>
</svg>
